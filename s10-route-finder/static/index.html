<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S10 route finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --ink:#1b1b1b; --muted:#666; --line:#dcdcdc; --good:#1b7f3b; --bad:#a33; --bg:#f7f7f5; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  .layout { display:flex; height:100vh; }
  #map { flex:1 1 auto; }
  .panel { width:380px; flex:0 0 380px; overflow-y:auto; background:#fff; border-left:1px solid var(--line); padding:18px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 16px; }
  fieldset { border:1px solid var(--line); border-radius:6px; margin:0 0 14px; padding:12px; }
  legend { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:0 4px; }
  label { display:block; font-size:13px; margin-bottom:6px; }
  input[type=number], select { width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:4px; font:inherit; }
  .radios { display:flex; gap:10px; flex-wrap:wrap; }
  .radios label { display:flex; align-items:center; gap:5px; margin:0; }
  button { width:100%; padding:10px; border:0; border-radius:5px; background:var(--ink); color:#fff; font:inherit; cursor:pointer; }
  button.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); margin-top:8px; }
  button[disabled] { opacity:.5; cursor:not-allowed; }
  .note { font-size:12px; color:var(--muted); margin-top:8px; }
  .msg { padding:10px; border-radius:5px; font-size:13px; margin-bottom:12px; }
  .msg.error { background:#fdeaea; color:#7b1d1d; }
  .msg.warn { background:#fdf5e2; color:#6b4f14; }
  .msg.info { background:#eef3fb; color:#234; }
  .card { border:1px solid var(--line); border-left:4px solid var(--line); border-radius:5px; padding:10px 12px; margin-bottom:10px; cursor:pointer; background:#fff; }
  .card:hover { border-color:#bbb; }
  .card.selected { border-left-color:var(--ink); background:#fafafa; }
  .card h3 { margin:0 0 6px; font-size:15px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .badge { font-size:11px; padding:2px 7px; border-radius:999px; white-space:nowrap; }
  .badge.good { background:#e4f3e9; color:var(--good); }
  .badge.bad  { background:#fbeaea; color:var(--bad); }
  .stat { font-size:13px; color:#333; }
  .stat span { color:var(--muted); }
  .err { font-size:12px; color:var(--muted); margin-top:4px; }
  .group-heading { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 0 8px; }
</style>
</head>
<body>
<div class="layout">
  <div id="map"></div>
  <div class="panel">
    <h1>S10 route finder</h1>
    <p class="sub">Click the map to move the start. Routes are generated, measured and ranked against your targets.</p>

    <div id="messages"></div>

    <fieldset>
      <legend>Start</legend>
      <div class="stat" id="start-readout">&mdash;</div>
    </fieldset>

    <fieldset>
      <legend>Route</legend>
      <label for="distance">Distance (km)</label>
      <input type="number" id="distance" value="5" min="1" max="30" step="0.5">

      <label style="margin-top:12px">Climb</label>
      <div class="radios" id="climb-presets"></div>
      <label style="margin-top:10px" for="climb-m">or exact metres of ascent (blank to use the preset)</label>
      <input type="number" id="climb-m" min="0" step="10" placeholder="e.g. 220">

      <label style="margin-top:12px" for="shape">Shape</label>
      <select id="shape">
        <option value="loop">Loop</option>
        <option value="out_and_back">Out and back</option>
      </select>
    </fieldset>

    <button id="search">Search</button>
    <button id="search-again" class="secondary" disabled>Search again (fresh seeds, new budget)</button>
    <div class="note" id="budget-note"></div>

    <div id="results"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/static/app.js"></script>
</body>
</html>
