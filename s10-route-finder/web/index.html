<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S10 route finder</title>
<meta name="theme-color" content="#1b1b1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="S10 Routes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%231b1b1b'/><path d='M8 46 L22 26 L32 36 L44 16 L56 30' stroke='%23fff' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%231b1b1b'/><path d='M8 46 L22 26 L32 36 L44 16 L56 30' stroke='%23fff' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --ink:#1b1b1b; --muted:#666; --line:#dcdcdc; --good:#1b7f3b; --bad:#a33; --bg:#f7f7f5; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body {
    font:16px/1.45 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
    color:var(--ink); background:var(--bg);
  }

  /* Phone first: map on top, controls below, both scrolling as one column. */
  .layout { display:flex; flex-direction:column; height:100vh; height:100dvh; }
  #map { flex:0 0 42vh; flex-basis:42dvh; width:100%; }
  .panel {
    flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:#fff; border-top:1px solid var(--line);
    padding:14px 16px calc(20px + env(safe-area-inset-bottom));
  }

  h1 { font-size:17px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 14px; }
  fieldset { border:1px solid var(--line); border-radius:8px; margin:0 0 12px; padding:12px; }
  legend { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); padding:0 4px; }
  label { display:block; font-size:13px; margin-bottom:6px; color:#333; }

  /* 16px inputs stop iOS Safari zooming in on focus. */
  input, select, button { font:inherit; font-size:16px; }
  input[type=number], input[type=password], input[type=text], select {
    width:100%; padding:11px 10px; border:1px solid var(--line); border-radius:6px; background:#fff;
  }
  .radios { display:flex; gap:8px; }
  .radios label {
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    margin:0; padding:11px 4px; border:1px solid var(--line); border-radius:6px;
    font-size:14px; cursor:pointer; background:#fff;
  }
  .radios label:has(input:checked) { border-color:var(--ink); background:#f2f2f0; font-weight:600; }
  .radios input { margin:0; }

  button {
    width:100%; padding:14px; border:0; border-radius:8px;
    background:var(--ink); color:#fff; cursor:pointer; font-weight:600;
  }
  button.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); margin-top:8px; font-weight:400; }
  button.link { width:auto; background:none; color:var(--muted); border:0; padding:0; font-size:13px; text-decoration:underline; font-weight:400; }
  button[disabled] { opacity:.45; }

  .note { font-size:12px; color:var(--muted); margin-top:10px; }
  .msg { padding:10px 12px; border-radius:6px; font-size:13px; margin-bottom:10px; }
  .msg.error { background:#fdeaea; color:#7b1d1d; }
  .msg.warn  { background:#fdf5e2; color:#6b4f14; }
  .msg.info  { background:#eef3fb; color:#243b55; }

  .card {
    border:1px solid var(--line); border-left:4px solid var(--line); border-radius:8px;
    padding:12px; margin-bottom:10px; background:#fff; cursor:pointer;
  }
  .card.selected { border-left-color:var(--ink); background:#fafafa; }
  .card h3 { margin:0 0 6px; font-size:16px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .badge { font-size:11px; padding:3px 8px; border-radius:999px; white-space:nowrap; font-weight:600; }
  .badge.good { background:#e4f3e9; color:var(--good); }
  .badge.bad  { background:#fbeaea; color:var(--bad); }
  .stat { font-size:14px; }
  .stat span { color:var(--muted); }
  .err { font-size:12px; color:var(--muted); margin-top:4px; }
  .group-heading { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:16px 0 8px; }
  details summary { font-size:13px; color:var(--muted); cursor:pointer; margin-bottom:10px; }

  /* Desktop: map beside the panel. */
  @media (min-width: 860px) {
    .layout { flex-direction:row; }
    #map { flex:1 1 auto; height:100%; }
    .panel { flex:0 0 400px; width:400px; border-top:0; border-left:1px solid var(--line); padding:18px; }
  }
</style>
</head>
<body>
<div class="layout">
  <div id="map"></div>
  <div class="panel">
    <h1>S10 route finder</h1>
    <p class="sub">Tap the map to set your start. Routes are generated, measured and ranked against your targets.</p>

    <div id="messages"></div>

    <details id="settings">
      <summary>Settings: OpenRouteService key</summary>
      <fieldset>
        <legend>Your key</legend>
        <label for="api-key">Stored in this browser only. It is never sent anywhere except OpenRouteService.</label>
        <input type="password" id="api-key" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="paste your key">
        <button id="save-key" class="secondary">Save key</button>
        <div class="note">
          Free key from openrouteservice.org/dev/#/signup.
          <span id="terrain-note"></span>
          <button id="clear-terrain" class="link">Clear terrain store</button>
        </div>
      </fieldset>
    </details>

    <fieldset>
      <legend>Start</legend>
      <div class="stat" id="start-readout">&mdash;</div>
    </fieldset>

    <fieldset>
      <legend>Route</legend>
      <label for="distance">Distance (km)</label>
      <input type="number" id="distance" value="5" min="1" max="30" step="0.5" inputmode="decimal">

      <label style="margin-top:12px">Climb</label>
      <div class="radios" id="climb-presets"></div>
      <label style="margin-top:10px" for="climb-m">or exact metres of ascent</label>
      <input type="number" id="climb-m" min="0" step="10" inputmode="numeric" placeholder="blank to use the preset above">

      <label style="margin-top:12px" for="shape">Shape</label>
      <select id="shape">
        <option value="loop">Loop</option>
        <option value="out_and_back">Out and back</option>
      </select>
    </fieldset>

    <button id="search">Search</button>
    <button id="search-again" class="secondary" disabled>Search again (fresh seeds, new budget)</button>
    <div class="note" id="budget-note"></div>

    <div id="results"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="./app.js"></script>
</body>
</html>
